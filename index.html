<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Te quedas conmigo esta noche?</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        h1 {
            font-size: 2em;
            color: #ff4d6d;
        }
        .buttons {
            position: relative;
            margin-top: 20px;
        }
        button {
            font-size: 1.2em;
            padding: 10px 15px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.2s ease, background 0.3s;
        }
        #yes {
            background-color: #28a745;
            color: white;
        }
        #yes:hover {
            background-color: #218838;
            transform: scale(1.1);
        }
        #no {
            background-color: #dc3545;
            color: white;
            position: absolute;
        }
        .message {
            font-size: 1.8em;
            color: #ff4d6d;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            margin-top: 20px;
        }
        .heart, .star {
            position: absolute;
            font-size: 1.5em;
            animation: floatUp 2s infinite ease-in-out;
        }
        @keyframes floatUp {
            from { transform: translateY(0) scale(1); opacity: 1; }
            to { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¿Te quedas conmigo esta noche?</h1>
        <div class="buttons">
            <button id="yes" onclick="sayYes()">Sí</button>
            <button id="no" onmouseover="moveNo()" onclick="moveNo()">No</button>
        </div>
        <div id="message" class="message">¡Yo sabía que dirías que sí! 💖</div>
    </div>
    <script>
        let moveDistance = 100;
        function sayYes() {
            let message = document.getElementById("message");
            message.style.opacity = "1";
            message.style.transform = "scale(1)";
            createHeartsAndStars();
        }
        function moveNo() {
            let button = document.getElementById("no");
            let x = (Math.random() * moveDistance * 2) - moveDistance;
            let y = (Math.random() * moveDistance * 2) - moveDistance;
            button.style.transform = `translate(${x}px, ${y}px)`;
            moveDistance += 50; // Aumenta la distancia de movimiento en cada interacción
        }
        function createHeartsAndStars() {
            for (let i = 0; i < 10; i++) {
                let symbol = Math.random() > 0.5 ? '💖' : '✨';
                let element = document.createElement("div");
                element.innerHTML = symbol;
                element.classList.add(symbol === '💖' ? 'heart' : 'star');
                document.body.appendChild(element);
                element.style.left = `${Math.random() * window.innerWidth}px`;
                element.style.top = `${Math.random() * window.innerHeight}px`;
                element.style.animationDuration = `${Math.random() * 2 + 1}s`;
                setTimeout(() => element.remove(), 2000);
            }
        }
    </script>
</body>
</html>
